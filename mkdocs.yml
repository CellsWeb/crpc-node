site_name: CellsWeb RPC Node
site_description: High-Performance RPC API Framework for Node.js, Bun & TypeScript
site_author: CellsWeb
site_url: https://cellsweb.github.io/crpc-node/

repo_name: CellsWeb/crpc-node
repo_url: https://github.com/CellsWeb/crpc-node

theme:
  name: material
  language: en
  palette:
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Start:
      - Overview: index.md
      - Install & Configure: getting-started.md
      - Release & Migration: migration.md
  - User Guides:
      - Functions & Contracts: functions.md
      - Schemas: schemas.md
      - Middleware & Authentication: middlewares.md
      - Uploads & Multipart: uploads.md
      - Seven HTTP Adapters: adapters.md
      - Client SDK & React: client.md
      - Workers: workers.md
      - Interactive API Docs: interactive-docs.md
      - CLI: cli.md
      - In-Memory Testing: testing.md
  - Reference:
      - Public API: api-reference.md
      - Protocol Overview: architecture.md
      - Benchmarks & Limits: benchmarks.md
      - Go Interoperability: crpc-go.md
  - Contributor Guides:
      - Contributing: contributing.md
      - Development Setup: development.md
      - Source Map & Design: internals/index.md
      - Shared Protocol: internals/protocol.md
      - Request Lifecycle: internals/lifecycle.md
      - Discovery, Middleware & Context: internals/registration.md
      - TypeBox & Errors: internals/validation.md
      - Adapters, Parsers & Uploads: internals/transports.md
      - Client, React/RN & Workers: internals/client-workers.md
      - Embedded Renderer: internals/renderer.md
      - CLI & Scaffolding: internals/tooling.md
      - Testing & Safe Extension: internals/testing.md
      - Release Engineering: internals/releasing.md
  - Community:
      - Security Policy: security.md
      - Code of Conduct: code-of-conduct.md
      - Go Contributor Docs: https://cellsweb.github.io/crpc-go/internals/
